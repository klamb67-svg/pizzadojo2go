<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu - Pizza Dojo 2Go</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="layout.css">

  <style>
    :root {
      --overlay-top: 0.25;
      --overlay-bot: 0.65;
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Bangers', cursive;
      color: var(--dojo-cream);
      text-align: center;
      overflow-y: auto;
      overflow-x: hidden;
      background: #000;
    }

    /* Background image - InsideBackground.png for all non-home pages */
    body {
      background-image: url('assets/images/InsideBackground.png');
      background-size: contain;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #000;
    }

    /* Desktop: ensure full dojo is visible */
    @media (min-width: 769px) {
      body {
        background-size: contain;
        background-position: center center;
      }
    }

    /* Mobile: adjust to show full dojo */
    @media (max-width: 768px) {
      body {
        background-size: contain;
        background-position: center center;
        background-attachment: scroll;
      }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, var(--overlay-top)),
        rgba(0, 0, 0, var(--overlay-bot))
      );
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
      padding: 4rem 2rem;
      padding-bottom: 6rem;
    }

    /* Mobile: adjust padding */
    @media (max-width: 768px) {
      .container {
        padding: 2rem 1.5rem;
        padding-bottom: 5rem;
      }
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      max-width: 900px;
      width: 100%;
    }

    .headline {
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      margin: 0;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
      color: var(--dojo-gold);
    }

    .coming-soon {
      font-size: 1.5rem;
      text-shadow: 0 2px 10px rgba(0,0,0,.6);
      color: var(--dojo-cream);
      line-height: 1.8;
    }

    .btn {
      border: 2px solid var(--dojo-gold);
      padding: .7rem 1.6rem;
      text-decoration: none;
      color: var(--dojo-cream);
      font-size: 1.1rem;
      transition: all .25s ease;
      border-radius: .4rem;
      background: rgba(93, 64, 55, 0.4);
      backdrop-filter: blur(2px);
      margin-top: 1rem;
    }

    .btn:hover {
      background: var(--dojo-gold);
      color: var(--dojo-wood);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    /* Mobile: increase font sizes for readability */
    @media (max-width: 768px) {
      .headline {
        font-size: 2.2rem;
      }
      
      .coming-soon {
        font-size: 1.2rem;
      }
      
      .btn {
        font-size: 1.2rem;
        padding: 0.9rem 2rem;
      }
    }
  </style>
</head>

<body>
  <!-- Navigation Menu -->
  <nav class="nav-menu" aria-label="Main navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html" class="active">Menu</a></li>
      <li><a href="events.html">Events</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="contact.html">Contact Us</a></li>
      <li><a href="about.html">About Us</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>
  </nav>

  <div class="overlay" aria-hidden="true"></div>

  <div class="container">
    <main>
      <h1 class="headline">Menu</h1>
      <p class="coming-soon">Our menu is being crafted with the same dedication we bring to every pizza. Check back soon for our full selection of artisan pizzas, each made with premium ingredients and the 30Pie philosophy.</p>
      <a href="index.html" class="btn">Return Home</a>
    </main>
  </div>
</body>
</html>
