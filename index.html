<body class="home">
  <!-- Navigation Menu (stays put while the doors open) -->
  <nav class="nav-menu" aria-label="Main navigation">
    <ul>
      <li><a href="index.html" class="active">Home</a></li>

      <li><a href="about.html">About Us</a></li>
      <li><a href="gallery.html">Gallery</a></li>
    </ul>

  <!-- What's behind the doors: the interior background every inner page uses -->
  <div class="reveal" aria-hidden="true"></div>

  <!-- The home page IS the door. It gets cloned and split when a link is tapped. -->
  <main class="door-scene" id="door-scene">
    <div class="stage">
      <img class="stage-bg" src="assets/images/home/dojo-outside.webp" alt="" width="1872" height="1056">
      <!-- Neon sign: the painted letters light up like neon tubes -->
      <div class="neon-sign" aria-hidden="true">
        <img class="neon-shadow" src="assets/images/home/neon-letters.webp" alt="">
        <img class="neon-shadow" src="assets/images/home/neon-i.webp" alt="">
        <img class="neon-shadow" src="assets/images/home/neon-j.webp" alt="">
        <img class="neon-tube" src="assets/images/home/neon-letters.webp" alt="">
        <img class="neon-tube neon-loose" src="assets/images/home/neon-i.webp" alt="">
        <img class="neon-tube neon-loose" src="assets/images/home/neon-j.webp" alt="">
      </div>
      <!-- Living scene: lantern glow + fireflies (fireflies added by JS) -->
      <div class="lanterns" aria-hidden="true">
        <span style="--x:23.08%;--y:38.54%;--d:0s"></span>
        <span style="--x:28.74%;--y:37.88%;--d:-1.3s"></span>
        <span style="--x:36.97%;--y:38.83%;--d:-2.1s"></span>
        <span style="--x:64.21%;--y:38.83%;--d:-0.7s"></span>
        <span style="--x:72.22%;--y:37.12%;--d:-2.6s"></span>
        <span style="--x:77.30%;--y:39.02%;--d:-1.8s"></span>
      </div>
      <div class="fireflies" aria-hidden="true"></div>
      <div class="meatball-man">
        <img class="mm-rest" src="assets/images/home/mm-rest.webp" alt="">
        <img class="mm-peel" src="assets/images/home/mm-peel.webp" alt="">
        <img class="mm-body" src="assets/images/home/mm-body.webp" alt="">
        <h1 class="speech-bubble">Coming to Central Wisconsin <span>Spring&nbsp;2027!</span></h1>
      </div>
    </div>
    <div class="overlay" aria-hidden="true"></div>

    <footer class="home-footer">
      <div class="caption-box">
        <p class="footer-text">
          Pizza Dojo is an artisan flame baked pizza trailer.<br>
          Follow us for more information!
        </p>
        <a class="comic-btn ig-btn" href="https://www.instagram.com/pizzadojo2go/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">

  <!-- Split halves + crack get built here at tap time -->
  <div class="doors" id="doors" aria-hidden="true"></div>
