<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pizza Dojo 2Go - Coming Soon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="layout.css">

  <style>
    :root {
      --overlay-top: 0.25;
      --overlay-bot: 0.65;
      --title-size: clamp(2.5rem, 8vw, 5rem);
      --tagline-size: clamp(1.1rem, 3.2vw, 2rem);
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Bangers', cursive;
      color: #fff;
      text-align: center;
      overflow: hidden;
      background: #000;
    }

    /* Background image - homepage uses background.png */
    body {
      background-image: url('assets/images/background.png');
      background-size: 100% auto;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    
    /* Desktop: width-based sizing for optimal display */
    @media (min-width: 769px) {
      body {
        background-size: 100% auto;
        background-position: center center;
      }
    }
    
    /* Mobile: adjust to show full dojo */
    @media (max-width: 768px) {
      body {
        background-size: 100% auto;
        background-position: center center;
        background-attachment: scroll;
      }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,var(--overlay-top)),
        rgba(0,0,0,var(--overlay-bot))
      );
      z-index: 1;
      pointer-events: none;
    }

    .container {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15rem;
      padding: 3vh 5vw;
      z-index: 2;
    }

    header {
      margin-top: -8rem;
    }

    .site-title {
      margin: 0;
      font-size: var(--title-size);
      font-weight: 400;
      font-family: 'Bangers', cursive;
      text-shadow: 0 3px 20px rgba(0,0,0,.8);
      letter-spacing: 0.05em;
      color: var(--dojo-cream);
    }

    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 4rem;
    }

    .headline {
      font-size: var(--tagline-size);
      font-weight: 400;
      font-family: 'Bangers', cursive;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
      color: var(--dojo-cream);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 2px solid var(--dojo-gold);
      padding: .7rem 1.6rem;
      text-decoration: none;
      color: var(--dojo-cream);
      font-size: 1.1rem;
      font-weight: 400;
      font-family: 'Bangers', cursive;
      letter-spacing: 0.05em;
      transition: all .25s ease;
      border-radius: .4rem;
      background: rgba(93, 64, 55, 0.4);
      backdrop-filter: blur(2px);
    }

    .btn:hover {
      background: var(--dojo-gold);
      color: var(--dojo-wood);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    /* Mobile: adjust spacing */
    @media (max-width: 768px) {
      html, body {
        overflow-y: auto;
      }

      .container {
        min-height: 100vh;
        height: auto;
        gap: 18rem;
      }

      header {
        margin-top: -10rem;
      }

      .site-title {
        font-size: clamp(2.8rem, 10vw, 4rem);
      }
      
      .headline {
        font-size: clamp(1.2rem, 5vw, 1.8rem);
      }
      
      .btn {
        font-size: 1.3rem;
        padding: 0.9rem 2rem;
      }

      .bottom-section {
        margin-top: 6rem;
      }
    }
  </style>
</head>

</body>
