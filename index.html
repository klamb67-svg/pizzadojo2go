  <style>
    :root {
      --overlay-top: 0.25;
      --overlay-bot: 0.65;
      --title-size: clamp(2.5rem, 8vw, 5rem);
      --tagline-size: clamp(1.1rem, 3.2vw, 2rem);
    }

    html, body {
      min-height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Bangers', cursive;
      color: #fff;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      background: #000;
    }

    /* Background image - homepage uses background.png */
    body {
      background-image: url('assets/images/background.png');
      background-size: 100% auto;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
    
    /* Desktop: width-based sizing for optimal display */
    @media (min-width: 769px) {
      body {
        background-size: 100% auto;
        background-position: center center;
      }
    }
    
    /* Mobile: background fills viewport, fixed height, no scroll */
    @media (max-width: 768px) {
      body {
        background-image: url('assets/images/Mobilebackground.png');
        background-size: cover;
        background-position: center center;
        background-attachment: scroll;
        height: 100vh;
      }
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        to bottom,
        rgba(0,0,0,var(--overlay-top)),
        rgba(0,0,0,var(--overlay-bot))
      );
      z-index: 1;
      pointer-events: none;
    }

    /* Hide overlay on mobile to show bright background */
    @media (max-width: 768px) {
      .overlay {
        display: none;
      }
    }

    .container {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 15rem;
      padding: 3vh 5vw;
      z-index: 2;
    }

    header {
      margin-top: -8rem;
    }

    .site-title {
      margin: 0;
      font-size: var(--title-size);
      font-weight: 400;
      font-family: 'Bangers', cursive;
      text-shadow: 0 3px 20px rgba(0,0,0,.8);
      letter-spacing: 0.05em;
      color: var(--dojo-cream);
    }

    .bottom-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      margin-top: 4rem;
    }

    .headline {
      font-size: var(--tagline-size);
      font-weight: 400;
      font-family: 'Bangers', cursive;
      letter-spacing: 0.02em;
      text-shadow: 0 2px 14px rgba(0,0,0,.6);
      color: var(--dojo-cream);
    }

    .actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      border: 2px solid var(--dojo-gold);
      padding: .7rem 1.6rem;
      text-decoration: none;
      color: var(--dojo-cream);
      font-size: 1.1rem;
      font-weight: 400;
      font-family: 'Bangers', cursive;
      letter-spacing: 0.05em;
      transition: all .25s ease;
      border-radius: .4rem;
      background: rgba(93, 64, 55, 0.4);
      backdrop-filter: blur(2px);
    }

    .btn:hover {
      background: var(--dojo-gold);
      color: var(--dojo-wood);
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.4);
    }

    /* Mobile: no scrolling, fixed layout */
    @media (max-width: 768px) {
      html, body {
        overflow-y: hidden;
        height: 100vh;
      }

      .container {
        height: 100vh;
        gap: 2rem;
      }

      header {
        margin-top: -10rem;
      }

      .site-title {
        font-size: clamp(2.8rem, 10vw, 4rem);
      }
      
      .headline {
        font-size: clamp(1.2rem, 5vw, 1.8rem);
      }
      
      .btn {
        font-size: 1.3rem;
        padding: 0.9rem 2rem;
      }

      .bottom-section {
        margin-top: 6rem;
      }
    }

    /* Top announcement - first line moved here */
    .top-announcement {
      position: fixed;
      top: 200px;
      left: 0;
      right: 0;
      z-index: 10;
      text-align: center;
      font-family: 'Bangers', cursive;
      font-size: 2.8rem;
      font-weight: 700;
      color: #ffffff;
      text-shadow: 0 3px 20px rgba(0,0,0,0.8);
      padding: 10px 20px;
    }

    @media (max-width: 768px) {
      .top-announcement {
        font-size: 1.6rem;
        top: 90px;
      }
    }

    /* Homepage Footer */
    .home-footer {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 20px;
      max-width: 1200px;
      margin: -300px auto 0;
    }

    .footer-text {
      color: #f4e4c1;
      font-family: 'Varela Round', sans-serif;
      font-size: 1.2rem;
      font-weight: normal;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .footer-headline {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 30px;
      align-items: center;
    }

    .social-icon {
      width: 48px;
      height: 48px;
      transition: transform 0.3s ease, opacity 0.3s ease;
      display: block;
    }

    .social-icon path {
      transition: fill 0.3s ease;
    }

    .social-links a:hover .social-icon {
      transform: scale(1.1);
    }

    .social-links a:hover .social-icon path {
      fill: #d4a574;
    }

    /* Mobile */
    @media (max-width: 768px) {
      .social-icon {
        width: 28px;
        height: 28px;
      }
    }

    /* Mobile Footer - fixed at bottom, no scroll */
    @media (max-width: 768px) {
      .home-footer {
        position: fixed;
        bottom: 5px;
        left: 0;
        right: 0;
        padding: 8px 12px;
        margin: 0;
      }

      .footer-text {
        font-size: 0.85rem;
        font-weight: 700;
        line-height: 1.1;
        margin-bottom: 8px;
      }

      .footer-headline {
        font-size: 0.8rem;
        margin-bottom: 2px;
        display: block;
      }
    }
  </style>
</head>
